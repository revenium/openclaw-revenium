name: Shell tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    name: shell-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install sqlite3
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)

      - name: Run every suite under tests/
        run: bash tests/run-all.sh
